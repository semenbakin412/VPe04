name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/flask-test-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,frontend/**"
          target: "/opt/flask-test-app"

      - name: Deploy on remote server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p /opt/flask-test-app
            cd /opt/flask-test-app

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            echo "BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/flask-test-app:latest" > .env
            export COMPOSE_PROJECT_NAME=flask-test-app

            # Stop and remove any legacy containers that can conflict by name or ports.
            docker rm -f flask-backend nginx-frontend flask-test-app 2>/dev/null || true
            docker ps -aq --filter name='^/flask-backend$' | xargs -r docker rm -f
            docker ps -aq --filter name='^/nginx-frontend$' | xargs -r docker rm -f
            docker ps -aq --filter name='^/flask-test-app$' | xargs -r docker rm -f

            # Remove possible stale networks from previous project names.
            docker network rm flask-test-app_app-network actions_app-network 2>/dev/null || true

            docker compose -p "$COMPOSE_PROJECT_NAME" down --remove-orphans || true
            docker compose -p "$COMPOSE_PROJECT_NAME" pull backend
            docker compose -p "$COMPOSE_PROJECT_NAME" up -d --no-build --force-recreate --remove-orphans
